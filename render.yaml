# Render blueprint — DesignersMeet CRM (full-stack: backend serves frontend).
# Deploy: push repo to GitHub, then Render dashboard → New → Blueprint.
# ~4 min to live. The backend serves the React SPA on the same origin so
# /api calls are same-origin — no CORS config required.
services:
  - type: web
    name: designersmeet-crm
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      npm install &&
      npm --workspace @dm/shared run build &&
      npm --workspace @dm/backend run build &&
      npm --workspace @dm/frontend run build
    startCommand: node packages/backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: dev
      - key: DEMO_BYPASS
        value: "true"
      - key: DATA_PROVIDER
        value: memory
      - key: QUEUE_PROVIDER
        value: memory
      - key: CORS_ORIGIN
        value: "*"
      - key: BACKEND_PORT
        value: "10000"
