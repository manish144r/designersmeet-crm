# Render blueprint — DesignersMeet CRM backend (free tier, no card required).
# Deploy: push repo to GitHub, then in Render dashboard → New → Blueprint →
# pick this repo. Render reads this file. ~2 min to live.
services:
  - type: web
    name: designersmeet-crm-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm --workspace @dm/shared run build && npm --workspace @dm/backend run build
    startCommand: node packages/backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: entra
      - key: DATA_PROVIDER
        value: memory
      - key: BACKEND_PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://designersmeet-preview.surge.sh
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_AUDIENCE
        sync: false
