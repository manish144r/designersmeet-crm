version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      - sqlserver
    networks: [crm]

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks: [crm]

  # Optional: only needed when DATA_PROVIDER=sqlserver
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_PASSWORD:-Designers!Meet1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks: [crm]

  # Optional: emulates Azure Service Bus locally
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite --queueHost 0.0.0.0"
    ports:
      - "10001:10001"
    networks: [crm]

volumes:
  mssql_data:

networks:
  crm:
    driver: bridge
